<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerConnect | Your Account</title><link rel="stylesheet" href="/css/style.css"><style>body{font-family:Arial,sans-serif;background:#fbfaff;color:#19162b;margin:0}.account-nav{height:78px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #eeeafc}.account-nav a{color:#7657ff;text-decoration:none;font-weight:700}.account{width:min(1040px,90%);margin:46px auto}.account-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.account-head h1{font-size:38px;letter-spacing:-1.2px;margin:0 0 8px}.account-head p{color:#716d7e}.logout{border:0;border-radius:11px;padding:12px 18px;background:#7657ff;color:white;font-weight:700;cursor:pointer}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}.panel{padding:24px;background:white;border:1px solid #eeeafc;border-radius:18px;box-shadow:0 10px 30px #473a7d0a}.panel h2{margin:0 0 17px;font-size:21px}.saved-item{padding:15px 0;border-top:1px solid #eeeafc}.saved-item:first-of-type{border-top:0}.saved-item h3{font-size:16px;margin:0 0 6px}.saved-item p{font-size:13px;color:#716d7e;line-height:1.5;margin:0}.saved-item a{display:inline-block;margin-top:9px;color:#7657ff;font-weight:700;text-decoration:none}.empty{color:#716d7e;font-size:14px;line-height:1.6}.history{margin:12px 0;padding:14px;border-radius:12px;background:#fbfaff}.history strong{display:block;margin-bottom:7px}.error{color:#a93434}@media(max-width:700px){.account-grid{grid-template-columns:1fr}.account-head{align-items:flex-start;flex-direction:column}.account-head h1{font-size:31px}}</style></head><body><header class="account-nav"><a href="/index.html">CareerConnect.</a><a href="/explore.html">Explore careers →</a></header><main class="account"><div class="account-head"><div><h1 id="welcome">Your career journey</h1><p>Keep the ideas and career paths you want to revisit.</p></div><button id="logout" class="logout">Log out</button></div><div id="account-message" class="empty" role="status"></div><div class="account-grid"><section class="panel"><h2>Saved careers</h2><div id="saved-careers" class="empty">Loading…</div></section><section class="panel"><h2>Saved opportunities</h2><div id="saved-scholarships" class="empty">Loading…</div></section><section class="panel" style="grid-column:1/-1"><h2>Quiz reflections</h2><div id="quiz-history" class="empty">Loading…</div></section></div></main><script src="/js/account.js" defer></script></body></html>
