<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerConnect | Career Quiz</title><link rel="stylesheet" href="/css/style.css"><style>
:root{--purple:#7657ff;--ink:#19162b;--muted:#716d7e}body{margin:0;background:#fbfaff;color:var(--ink);font-family:Arial,sans-serif}.quiz-nav{height:78px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #eeeafc}.quiz-nav a{color:var(--purple);font-weight:700;text-decoration:none}.quiz-wrap{width:min(880px,90%);margin:55px auto}.quiz-head{text-align:center;margin-bottom:28px}.quiz-head span{color:var(--purple);font-size:12px;font-weight:800;letter-spacing:1px}.quiz-head h1{font-size:42px;letter-spacing:-1.5px;margin:12px 0}.quiz-head p{color:var(--muted);line-height:1.65}.quiz-card{background:white;border:1px solid #eeeafc;border-radius:24px;padding:34px;box-shadow:0 18px 50px #4c398916}.progress{height:7px;background:#f0edfa;border-radius:8px;margin-bottom:26px;overflow:hidden}.progress i{display:block;height:100%;background:var(--purple);width:0;transition:.2s}.quiz-count{font-size:12px;color:var(--purple);font-weight:800;text-transform:uppercase;letter-spacing:.8px}.quiz-card h2{font-size:26px;line-height:1.3;margin:12px 0 22px}.quiz-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quiz-option{background:#fff;border:1px solid #e8e4f6;border-radius:14px;padding:17px;text-align:left;font:600 15px Arial;color:var(--ink);cursor:pointer}.quiz-option:hover,.quiz-option.active{border-color:var(--purple);background:#f5f2ff;color:#6948ef}.quiz-steps{display:flex;justify-content:space-between;align-items:center;margin-top:26px}.quiz-steps button{border:0;border-radius:11px;padding:13px 19px;font-weight:800;cursor:pointer}.back{background:#f5f3fa;color:#625d70}.next{background:var(--purple);color:white}.next:disabled{opacity:.4}.quiz-alert{color:#a93434;margin:16px 0 0}.results{display:grid;grid-template-columns:1fr;gap:12px}.result{border:1px solid #eeeafc;border-radius:15px;padding:18px}.result h3{margin:0 0 7px}.result p{color:var(--muted);line-height:1.5;margin:0}.result a{display:inline-block;margin-top:12px;color:var(--purple);font-weight:700;text-decoration:none}.note{font-size:12px;color:#777386;line-height:1.6;margin:20px 0 0}@media(max-width:580px){.quiz-head h1{font-size:32px}.quiz-card{padding:22px}.quiz-options{grid-template-columns:1fr}.quiz-wrap{margin:35px auto}}
</style></head><body><header class="quiz-nav"><a href="/index.html">CareerConnect<span style="color:#7657ff">.</span></a><a href="/explore.html">Explore careers →</a></header><main class="quiz-wrap"><div class="quiz-head"><span>✦ FIND YOUR DIRECTION</span><h1>A few questions to get you started.</h1><p>This reflection suggests fields to explore. It is not a test, diagnosis or final career decision.</p></div><section class="quiz-card" id="quiz-card"><div class="progress"><i id="progress"></i></div><div id="quiz-content" aria-live="polite">Loading your questions…</div></section></main><script src="/js/quiz.js" defer></script></body></html>
